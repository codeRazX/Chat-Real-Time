<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="main.js" defer></script>

</head>
<body>

    <header class="container">
        <h1>Chat Real-Time</h1>
    </header>

    <section class="nav-rooms container">
        <h2>Rooms:</h2>

        <div id="container-rooms" class="rooms-label">
            <p id="no-rooms-msg">There are no active rooms</p>
            <button id="create-room-btn">Create Room/Nick</button>
        </div>

     
    </section>

    <section id="chat" class="chat container">
        <p class="total-user">Users: <span id="total-user"></span></p>
        <img id="out-room" class="icon" src="assets/out.svg" alt="Icon go out room">
        <span id="create-room-data"></span>
        <h2 id="name-room">Football</h2>

        <ul id="chat-messages">
    
        </ul>

        <form id="form" action="#" autocomplete="off">
            <input type="text" name="message" id="message" placeholder="Type a message">
            <button type="submit">Send</button>
        </form>
    </section>

    <div id="overlay" class="overlay">
        <form action="#" id="form-create-room">
            <fieldset>
                <legend>New Room/Register Nick</legend>
                <div class="form-block">
                    <label for="name-room">Name Room:</label>
                    <input type="text" id="room" name="room" placeholder="Type a name for the room">
                </div>
               
                <div class="form-block">
                    <label for="name-user">Your Nick:</label>
                    <input type="text" id="user" name="user" placeholder="Type a nick for this season">
                </div>
               
                <button type="button" id="add-room-btn">Send Data</button>
            </fieldset>
            
            <span id="close-btn">X</span>
        </form> 
       
    </div>
</body>
</html>
